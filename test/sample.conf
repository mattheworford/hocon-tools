app {
  name = "my-service"
  version = 1.2.3

  server {
    host = localhost
    port = 8080
}

  database {
    url = "jdbc:postgresql://localhost:5432/mydb"
    pool-size = 10
    connection-timeout = 30s
  }

  features {
    enable-cache = true
    enable-metrics = false
    allowed-origins = ["https://example.com", "https://app.example.com"]
  }

  defaults {
    timeout = 5s
    retries = 3
  }

  http-client {
    timeout = ${app.defaults.timeout}
    retries = ${app.defaults.retries}
    max-connections = 100
  }

  env {
    home = ${HOME}
    user = ${USER}
    path = ${PATH}
    optional-var = ${?OPTIONAL_MISSING_VAR}
    java-home = ${JAVA_HOME}
  }
}
